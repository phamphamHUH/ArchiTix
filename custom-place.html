<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiTix</title>
    <link
      rel="shortcut icon"
      href="../../assets/icons/icon.jpg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/custom-place.css" />
  </head>
  <body>
    <header>
      <div id="mouse-glow"></div>
      <img
        src="../../assets/images/ArchiTix.png"
        alt="ArchiTix Logo"
        id="logo"
      />
      <nav>
        <a href="../../index.html" class="non-current">Home</a>
        <a href="../../features.html" class="non-current">Features</a>
        <a href="../../buy.html" class="non-current">Buy Tickets</a>
        <a href="../../sell.html" id="current">Sell Tickets</a>
        <a href="../../about.html" class="non-current">About</a>
      </nav>
      <div class="profile-wrapper">
        <div class="profile-circle">
          <img src="../../assets/icons/pfp.png" alt="User Profile Picture" />
        </div>
      </div>
    </header>
    <main>
      <section class="tools">
        <hr />
        <img src="../../assets/images/placeholder.png" alt="Tools" />
        <img src="../../assets/images/placeholder.png" alt="Tools" />
        <img src="../../assets/images/placeholder.png" alt="Tools" />
        <img
          src="../../assets/images/placeholder.png"
          alt="Tools"
          id="seat-icons"
        />
        <div id="popup-1" class="popup-1">
          <div class="popup-content-1">
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <p>Single Row</p>
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <p>Multiple Row</p>
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <p>Single Seat</p>
          </div>
        </div>
        <img src="../../assets/images/placeholder.png" alt="Tools" />
        <img
          src="../../assets/images/placeholder.png"
          alt="Tools"
          id="shapes"
        />
        <div id="popup-2" class="popup-2">
          <div class="popup-content-2">
            <div class="circle"></div>
            <div class="square"></div>
          </div>
        </div>
        <img src="../../assets/images/placeholder.png" alt="Tools" />
        <img src="../../assets/images/placeholder.png" alt="Tools" />
        <img src="../../assets/images/placeholder.png" alt="Tools" id="icons" />
        <div id="popup-3" class="popup-3">
          <div class="popup-content-3">
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
            <img src="../../assets/images/placeholder.png" alt="Tools" />
          </div>
        </div>
      </section>
      <section class="canvas"></section>
      <section class="event-info">
        <hr />
        <div class="category">
          <h3>Category</h3>
          <select name="category-drop" id="category-dd">
            <option value="None">None</option>
            <option value="Movie">Movie</option>
            <option value="Concert">Concert</option>
            <option value="Theater">Theater</option>
            <option value="Birthday">Birthday</option>
            <option value="Custom Event">Custom Event</option>
          </select>
        </div>
        <hr />
        <div class="seat-label">
          <h3>Seat Label</h3>
          <div>
            <label>
              Number
              <input type="text" class="labels" id="number" />
            </label>
            <label>
              Description
              <input type="text" class="labels" id="desc" />
            </label>
            <label>
              Price
              <input type="text" class="labels" id="price" />
            </label>
          </div>
        </div>
        <hr />
        <div class="seat-design">
          <h3>Seat Design</h3>
          <div class="color-wrapper">
            <label>
              Reserved Color
              <input type="color" id="reserved" />
            </label>
            <label>
              Vacant Color
              <input type="color" id="vacant" />
            </label>
          </div>
        </div>
        <hr />
        <button>Publish Event</button>
      </section>
    </main>
    <script src="../../js/global.js"></script>
    <script src="../../js/custom-place.js"></script>
  </body>
</html>
