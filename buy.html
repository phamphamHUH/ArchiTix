<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiTix</title>
    <link
      rel="shortcut icon"
      href="../../assets/icons/icon.jpg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/buy.css" />
  </head>
  <body>
    <header>
      <div id="mouse-glow"></div>
      <img
        src="../../assets/images/ArchiTix.png"
        alt="ArchiTix Logo"
        id="logo"
      />
      <nav>
        <a href="../../index.html" class="non-current">Home</a>
        <a href="../../features.html" class="non-current">Features</a>
        <a href="../../buy.html" id="current">Buy Tickets</a>
        <a href="../../sell.html" class="non-current">Sell Tickets</a>
        <a href="../../about.html" class="non-current">About</a>
      </nav>
      <div class="profile-wrapper">
        <div class="profile-circle">
          <img src="../../assets/icons/pfp.png" alt="User Profile Picture" />
        </div>
      </div>
    </header>
    <main>
      <h1>Buy Tickets</h1>
      <section>
        <div class="filters">
          <div class="filter-wrapper">
            <span class="filter-icon"
              ><img src="../../assets/icons/filter.png" alt=""
            /></span>
            <select name="filter" id="event-filter">
              <option value="">No Filter</option>
              <option value="Price - Low to High">Price - Low to High</option>
              <option value="Price - High to Low">Price - High to Low</option>
              <option value="Newest First">Newest First</option>
              <option value="Oldest First">Oldest First</option>
            </select>
          </div>
          <div class="search-wrapper">
            <input type="text" placeholder="Search Event" id="search-input" />
            <span class="search-icon"
              ><img src="../../assets/icons/search.png" alt=""
            /></span>
          </div>
        </div>
        <div class="events-wrapper">
          <div class="showing">
            <h2>Now Showing</h2>
            <div id="events-showing"></div>
          </div>
          <div class="upcoming">
            <h2>Upcoming</h2>
            <div id="events-upcoming"></div>
          </div>
        </div>
      </section>
    </main>
    <hr />
    <!-- FOOTER TAG THAT CONTAINS SOCMED LINKS -->
    <footer>
      <div class="row-1">
        <h2>Popular Event Places</h2>
        <a href="https://www.smxconventioncenter.com/">
          <img src="/assets/icons/SMXCC.webp" alt="SMX Convention Center">
        </a>
        <a href="https://www.mallofasia-arena.com/">
          <img src="/assets/icons/SM-MOA-Arena-Logo-white-small.webp" alt="SM MOA Arena"></a>
        <a href="https://smartaranetacoliseum.com/">
          <img src="/assets/icons/AranetaColiseum.png" alt="Araneta Coliseum">
        </a>
      </div>
      <div class="row-2">
        <div class="col-1">
          <h3>ArchiTix</h3>
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="sell.html">Sell Tickets</a>
          <a href="buy.html">Buy Tickets</a>
          <a href="features.html">Features</a>
        </div>
        <div class="col-2">
          <h3>Support & Join Us</h3>
          <form>
            <input type="text" placeholder="Your Email">
            <br>
            <button type="submit">Donate!</button>
            <button type="submit">Join!</button>
          </form>
        </div>
        <div class="col-3">
          <h3>Contact & Social Media</h3>
          <img src="assets/icons/icon.jpg" alt="" />
          <a href="https://www.facebook.com/randy.juanjr" target="_blank"
            ><img src="assets/icons/facebook.png" alt="Facebook Icon"
          /></a>
          <a href="https://www.facebook.com/randy.juanjr" target="_blank">
            <img src="assets/icons/instagram.png" alt="Instagram Icon" />
          </a>
          <a href="https://www.facebook.com/randy.juanjr" target="_blank">
            <img src="assets/icons/twitter.png" alt="Twitter Icon" />
          </a>
          <!-- <a href="https://www.facebook.com/randy.juanjr" target="_blank">
            <img src="assets/icons/youtube.png" alt="Youtube Icon" />
          </a> -->
        </div>
      </div>
      <div class="row-3">
        Architix, &copy; 2025. All right reserved.
        <a href="terms-service">Terms of service</a>|<a href="privacy">Privacy Policy</a>
      </div>
    </footer>

    <script src="../../js/global.js"></script>
    <script src="../../js/buy.js"></script>
  </body>
</html>
