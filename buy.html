<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiTix</title>
    <link
      rel="shortcut icon"
      href="../../assets/icons/icon.jpg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/buy.css" />
  </head>
  <body>
    <header>
      <div id="mouse-glow"></div>
      <img
        src="../../assets/images/ArchiTix.png"
        alt="ArchiTix Logo"
        id="logo"
      />
      <nav>
        <a href="../../index.html" class="non-current">Home</a>
        <a href="../../features.html" class="non-current">Features</a>
        <a href="../../buy.html" id="current">Buy Tickets</a>
        <a href="../../sell.html" class="non-current">Sell Tickets</a>
        <a href="../../about.html" class="non-current">About</a>
      </nav>
      <div class="profile-wrapper">
        <div class="profile-circle">
          <img src="../../assets/icons/pfp.png" alt="User Profile Picture" />
        </div>
      </div>
    </header>
    <main>
      <h1>Buy Tickets</h1>
      <section>
        <div class="filters">
          <div class="filter-wrapper">
            <span class="filter-icon"
              ><img src="../../assets/icons/filter.png" alt=""
            /></span>
            <select name="filter" id="eventFilter">
              <option>Price - Low to High</option>
              <option>Price - High to Low</option>
              <option>Newest First</option>
              <option>Oldest First</option>
            </select>
          </div>
          <div class="search-wrapper">
            <input type="text" placeholder="Search Event" />
            <span class="search-icon"
              ><img src="../../assets/icons/search.png" alt=""
            /></span>
          </div>
        </div>
        <div class="events">
          <div class="showing">
            <h2>Now Showing</h2>
            <div id="events"></div>
          </div>
          <div class="upcoming">
            <h2>Upcoming</h2>
            <div id="events"></div>
          </div>
        </div>
      </section>
    </main>
    <hr />
    <!-- FOOTER TAG THAT CONTAINS SOCMED LINKS -->
    <footer>
      <img src="assets/icons/icon.jpg" alt="" />
      <a href="https://www.facebook.com/randy.juanjr" target="_blank"
        ><img src="assets/icons/facebook.png" alt="Facebook Icon"
      /></a>
      <a href="https://www.facebook.com/randy.juanjr" target="_blank">
        <img src="assets/icons/instagram.png" alt="Instagram Icon" />
      </a>
      <a href="https://www.facebook.com/randy.juanjr" target="_blank">
        <img src="assets/icons/twitter.png" alt="Twitter Icon" />
      </a>
      <!-- <a href="https://www.facebook.com/randy.juanjr" target="_blank">
        <img src="assets/icons/youtube.png" alt="Youtube Icon" />
      </a> -->
    </footer>

    <script src="../../js/global.js"></script>
    <script src="../../js/home.js"></script>
  </body>
</html>
